name: zizmor

# Static security analysis of the GitHub Actions workflows themselves
# (script injection, over-broad permissions, unpinned actions, cache/artifact
# poisoning, credential persistence). This repo's main attack surface is CI, so
# the workflows get their own audit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          # zizmor uses the token for online audits (e.g. resolving action refs).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pipx run --spec zizmor==1.26.1 zizmor --persona regular .github/workflows
