name: zizmor

# Static security analysis of the GitHub Actions workflows themselves
# (script injection, over-broad permissions, unpinned actions, cache/artifact
# poisoning, credential persistence). This repo's main attack surface is CI, so
# the workflows get their own audit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          # zizmor uses the token for online audits (e.g. resolving action refs).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pipx run --spec zizmor==1.26.1 zizmor --persona regular .github/workflows
