name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 13:00 UTC — catches breakage from runner/tool updates.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install lint deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh
          # Linter installed globally in an ephemeral CI runner — no lockfile
          # needed (zizmor flags this as a low-severity adhoc-packages note).
          npm install --global markdownlint-cli2

      - name: Check shell formatting
        run: |
          shfmt -d -i 2 install.sh cs.zsh tests/smoke.zsh \
            context-switch.plugin.zsh claude-switch.plugin.zsh

      - name: Run shellcheck
        run: |
          shellcheck -x install.sh cs.zsh \
            context-switch.plugin.zsh claude-switch.plugin.zsh

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Lint Markdown
        run: |
          markdownlint-cli2 '**/*.md' '#node_modules'

      - name: Check typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          files: .

      - name: Check zsh syntax
        run: |
          set -euo pipefail
          # One `zsh -n` per file: extra arguments become $1/$2 for the script
          # being parsed, NOT additional files to check, so the single-command
          # form silently only ever parsed the first plugin file.
          for f in context-switch.plugin.zsh claude-switch.plugin.zsh cs.zsh tests/smoke.zsh; do
            echo "zsh -n $f"
            zsh -n "$f"
          done

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # harden-runner is Linux-only; skip it on the macOS matrix leg.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install jq || true # macOS images already ship jq

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq

      - name: Run smoke tests
        run: ./tests/smoke.zsh
