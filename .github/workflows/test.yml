name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 13:00 UTC — catches breakage from runner/tool updates.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20

      - name: Install lint deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh
          # Linter installed globally in an ephemeral CI runner — no lockfile
          # needed (zizmor flags this as a low-severity adhoc-packages note).
          npm install --global markdownlint-cli2

      - name: Check shell formatting
        run: |
          shfmt -d -i 2 install.sh cs.zsh tests/smoke.zsh claude-switch.plugin.zsh

      - name: Run shellcheck
        run: |
          shellcheck -x install.sh cs.zsh claude-switch.plugin.zsh

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Lint Markdown
        run: |
          markdownlint-cli2 '**/*.md' '#node_modules'

      - name: Check typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          files: .

      - name: Check zsh syntax
        run: |
          zsh -n claude-switch.plugin.zsh cs.zsh tests/smoke.zsh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # harden-runner is Linux-only; skip it on the macOS matrix leg.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install jq || true # macOS images already ship jq

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq

      - name: Run smoke tests
        run: ./tests/smoke.zsh
