version: 2
updates:
  # This is a zsh project with no package-manager manifest, so the only
  # dependencies to keep current are the GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # One grouped PR per week instead of one per action, to cut noise.
    groups:
      github-actions:
        patterns:
          - "*"
