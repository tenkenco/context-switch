name: Bug report
description: Report a reproducible problem with claude-switch.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please include enough detail to reproduce quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A short description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands and flow.
      placeholder: |
        1. Run `...`
        2. Run `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / output
      description: Paste relevant command output (redact tokens/secrets).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14.6 / Ubuntu 24.04 / ..."
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell version
      placeholder: "zsh 5.9"
    validations:
      required: true
  - type: input
    id: claude_code
    attributes:
      label: Claude Code version
      placeholder: "e.g. 2.1.132"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help.
