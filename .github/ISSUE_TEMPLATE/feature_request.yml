name: Feature request
description: Suggest an improvement to claude-switch.
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What pain point are you trying to fix?
      placeholder: Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What change would you like to see?
      placeholder: Describe your preferred behavior or command UX.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ideas you considered.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, examples, constraints, etc.
